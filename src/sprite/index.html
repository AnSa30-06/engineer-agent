<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src file: data:; media-src blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' file: blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co;" />
  <link rel="stylesheet" href="sprite.css" />
  <title>Engineer</title>
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"><span id="bubble-text"></span></div>
    <div id="call" class="hidden">
      <div id="call-label">Incoming call</div>
      <button id="answer">Answer</button>
    </div>
    <canvas id="sprite" width="256" height="256"></canvas>
    <div id="turn" class="hidden">
      <span id="turn-dot"></span>
      <span id="turn-label">Your turn</span>
      <span id="level"><i id="level-fill"></i></span>
    </div>
  </div>
  <script src="sprite.js" type="module"></script>
</body>
</html>
